# Example single-model pipeline config. Run with:
#   python run_pipeline.py example_config.yml
# or stage by stage (e.g. as separate SLURM jobs):
#   python generate_texts.py example_config.yml
#   python classify_stance.py example_config.yml
#   python classify_refusal.py example_config.yml

model: /data/labat/models/leolabat/Llama-3.1-Tulu-8B-SFT-100k

sampling_configs:
  - name: model_default
    num_generations: 100
    params: {}   # {} -> use the model's own generation_config (falling back
                 #  to temperature=0.7/top_p=0.9 if it doesn't ship one)
  - name: low_temp
    num_generations: 50
    params: {temperature: 0.3, top_p: 0.9, top_k: 50}
  - name: high_temp
    num_generations: 100
    params: {temperature: 1.0, top_p: 1.0, top_k: 50}

generation:
  max_new_tokens: 1024
  # backend: vllm   # optional, default "transformers" -- see vllm_backend.py
                     #  for the throughput/resume trade-off before switching

prompts:
  # First run: python export_mevs_opinions.py --output-csv mevs_opinions.csv
  opinions_csv: mevs_opinions.csv     # question_id, stance columns
  templates_csv: templates.csv        # template_id, template columns
  # -- or, instead of opinions_csv + templates_csv, point straight at any prompts CSV:
  # dataset_csv: /path/to/prompts.csv

stance_classifier:
  model: /data/labat/models/leolabat/Llama-3.1-Tulu-8B-SFT-100k
  template_id: templ-5   # IssueBench's own pick (extended dynamic prompt, llm
                          #  framing, negative examples, text first)
  batch_size: 64
  max_new_tokens: 64

refusal_classifier:
  checkpoint: /home/labat/refusal/configs/ca_and_ft/checkpoints
  batch_size: 256
  max_length: 4096

output_dir: runs/tulu_sft_100k
resume: true
